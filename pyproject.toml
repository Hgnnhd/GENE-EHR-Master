[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-ehr"
version = "0.1.0"
description = "UKB EHR pretraining and calendar-landmark cancer cohorts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.1", "pyarrow>=14", "polars>=1.0", "tqdm>=4.60"]

[tool.setuptools.packages.find]
where = ["."]
include = ["source_code*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
